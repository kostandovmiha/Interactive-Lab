name: Home 3D Lab checks
on:
  pull_request:
    paths:
      - 'home-3d-lab/**'
      - 'supabase/migrations/**'
      - 'index.html'
      - '.github/workflows/home-3d-checks.yml'
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core and PostgreSQL RLS checks
        run: |
          node --test home-3d-lab/tests/core.mjs
          npm --prefix /tmp/home3d-tools --cache /tmp/home3d-npm-cache install --no-audit --no-fund @electric-sql/pglite@0.3.14
          node home-3d-lab/tests/policies.mjs
      - name: Install browser tooling
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Browser checks (mocked Auth/Storage)
        run: python home-3d-lab/tests/browser.py
