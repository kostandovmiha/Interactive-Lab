name: Build Ukrainian kids voice clips

on:
  push:
    paths:
      - .github/workflows/build-kids-voice.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Create offline OGG voice pack (Tetiana)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install voice synthesizer
        run: |
          python -m pip install --upgrade pip
          pip install 'piper-tts>=1.2,<2'
          ffmpeg -version | head -1
          piper --help | head -12
      - name: Generate prerecorded Ukrainian phrases
        run: python scripts/generate_kids_voice.py
      - name: Commit and publish voice files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids-games/audio
          if git diff --cached --quiet; then
            echo "No changes to audio clips."
          else
            git commit -m "build(kids): publish Apache-2.0 Tetiana Ukrainian voice audio"
            git push origin HEAD:main
          fi
