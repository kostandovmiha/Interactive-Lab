<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6e9">
  <meta name="description" content="Казковий 3D-острів, де можна садити дерева, ставити будиночки та знайомитися із зайчиками.">
  <title>Мій чарівний острів</title>
  <link rel="icon" href="./island.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="game">
    <header class="top">
      <a class="control back" href="../" aria-label="До ігор"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6 6-6-6 6-6"/></svg><span>До ігор</span></a>
      <div class="heading"><img src="./island.svg" alt="" width="53" height="53"><h1>Мій чарівний острів</h1></div>
      <button type="button" class="control reset" id="reset" disabled aria-label="Очистити мої додавання"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.6 7.1M4 5v5h5"/></svg><span>Очистити</span></button>
    </header>

    <section class="stage" aria-label="Ігрове поле">
      <canvas id="island" tabindex="0" aria-label="Тривимірний острів" aria-describedby="keyboard"></canvas>
      <span id="keyboard" class="sr-only">Стрілками переміщуй позначку по землі. Натисни Enter або пробіл, щоб торкнутися острова. Кнопки після поля повертають і наближають острів.</span>
      <p class="loading" id="loading" role="status">Острів прокидається…</p>
      <noscript><p class="loading">Увімкни JavaScript у браузері, щоб відкрити острів.</p></noscript>
    </section>

    <div class="view" role="group" aria-label="Керування камерою" hidden>
      <div class="view-pair">
        <button type="button" id="left" class="control" aria-label="Повернути острів ліворуч"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 16a7 7 0 0 0-7-7H5m4-4L5 9l4 4"/></svg></button>
        <button type="button" id="right" class="control" aria-label="Повернути острів праворуч"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16a7 7 0 0 1 7-7h7m-4-4 4 4-4 4"/></svg></button>
      </div>
      <div class="view-pair">
        <button type="button" id="zoom-out" class="control" aria-label="Віддалити острів"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button type="button" id="zoom-in" class="control" aria-label="Наблизити острів"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-7-7v14"/></svg></button>
      </div>
      <button type="button" id="fit" class="control" aria-label="Показати весь острів"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H5v4m10-4h4v4M5 15v4h4m10-4v4h-4"/><circle cx="12" cy="12" r="1.5"/></svg></button>
    </div>

    <section class="dock" aria-label="Додати на острів">
      <p id="hint" role="status">Обери, кого чи що додати</p>
      <div class="tools">
        <button class="piece tree" type="button" data-piece="tree" aria-pressed="false" disabled>
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#bd7c4e" d="M21 29h6v12c0 2-6 2-6 0z"/><path fill="#4c9b62" d="M12 32a7 7 0 0 1-5-11 8 8 0 0 1 6-9 11 11 0 0 1 21-1 8 8 0 0 1 7 7 8 8 0 0 1-4 14c-8 3-15 4-25 0z"/><path fill="#91c974" d="M9 21a8 8 0 0 1 6-8 10 10 0 0 1 17-2c2 3 1 6-2 9A19 19 0 0 1 9 21z"/><circle fill="#f9dd8c" cx="29" cy="22" r="3"/><circle fill="#f7a892" cx="17" cy="25" r="2.5"/></svg>
          <span>Дерево</span>
        </button>
        <button class="piece house" type="button" data-piece="house" aria-pressed="false" disabled>
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#ffe7b6" d="M8 24 24 12l16 12v15a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z"/><path fill="#e68169" d="M4 24 21 8a4 4 0 0 1 6 0l17 16a2 2 0 0 1-3 3L24 13 7 27a2 2 0 0 1-3-3z"/><path fill="#5b9c8c" d="M19 31a5 5 0 0 1 10 0v11H19z"/><circle fill="#fffcdf" cx="26" cy="35" r="1.2"/><rect width="6" height="6" x="10" y="29" rx="2" fill="#85b5aa"/><rect width="6" height="6" x="32" y="29" rx="2" fill="#85b5aa"/></svg>
          <span>Будиночок</span>
        </button>
        <button class="piece bunny" type="button" data-piece="bunny" aria-pressed="false" disabled>
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff3e6" d="M13 27C7 8 15 1 20 11c2 3 3 8 3 12h2c0-4 1-9 3-12 5-10 13-3 7 16 4 2 7 5 7 9 0 6-7 9-18 9S6 42 6 36c0-4 3-7 7-9z"/><path d="M16 13l2 9m14-9-2 9" stroke="#efa9a6" stroke-width="3.5" stroke-linecap="round"/><circle cx="17" cy="33" r="1.8" fill="#4a4344"/><circle cx="31" cy="33" r="1.8" fill="#4a4344"/><path fill="#df8f8c" d="M21 36q3-2 6 0l-3 3z"/><circle cx="12" cy="37" r="2" fill="#facac0"/><circle cx="36" cy="37" r="2" fill="#facac0"/></svg>
          <span>Зайчик</span>
        </button>
      </div>
    </section>
  </main>

  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Очистити мої додавання?</h2>
      <p>Дерева, будиночки й зайчики, які ти додав, зникнуть.</p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" autofocus>Залишити</button>
        <button type="submit" value="clear">Очистити</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="./game.js"></script>
</body>
</html>
