<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#79cffa"><title>Веселий потяг — Kids Playground</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#a8e8ff;color:#12396d}button{font:inherit;cursor:pointer;touch-action:manipulation}main{max-width:1000px;margin:auto;padding:12px}.header{display:flex;align-items:center;justify-content:space-between;gap:10px}.home{color:#124f9c;text-decoration:none;font-weight:800;background:#fff;padding:12px;border-radius:18px}h1{font-size:clamp(25px,5vw,48px);text-align:center;color:#ffdb45;-webkit-text-stroke:1.5px #174b9e;text-shadow:2px 4px #174b9e;margin:10px 0}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.mode{border:3px solid #fff;border-radius:18px;background:#e8f7ff;padding:10px 2px;font-weight:850;color:#1856a0;font-size:clamp(11px,2.5vw,17px)}.mode.active{background:#ffdc60;border-color:#f39b3a}.scene{height:clamp(210px,37vw,345px);border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(#69cafa,#baf0ff 60%,#9de35c 61%,#56b34d);border:4px solid white}.cloud{position:absolute;font-size:35px;top:10%;left:17%}.sun{position:absolute;font-size:55px;right:5%;top:4%}.hill{position:absolute;bottom:17%;width:55%;height:26%;border-radius:60% 70% 0 0;background:#8ed466}.hill.a{left:-12%}.hill.b{right:-15%;background:#74c85b}.track{position:absolute;bottom:12%;height:13px;background:repeating-linear-gradient(90deg,#a16e3d 0 16px,#604c3e 16px 23px);width:100%;border-top:5px solid #59626b}.train{position:absolute;bottom:16%;left:1%;display:flex;align-items:end;gap:0;white-space:nowrap}.train.depart{animation:depart 4s ease-in forwards}.train.arrive{animation:arrive 2s ease-out both}@keyframes depart{0%{transform:translateX(0)}20%{transform:translateX(12px)}100%{transform:translateX(-130vw)}}@keyframes arrive{from{transform:translateX(130vw)}to{transform:translateX(0)}}.engine{width:clamp(105px,22vw,215px);flex:none}.mini{width:clamp(55px,14vw,140px);flex:none}.station{position:absolute;right:4%;bottom:25%;font-size:clamp(30px,7vw,65px)}.prompt{background:#fff;border:4px solid #64bff2;border-radius:25px;text-align:center;padding:12px;margin:12px 0;font-size:clamp(19px,4vw,29px);font-weight:900}.stars{text-align:center;font-size:25px}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.answer{border:4px solid #fff;border-radius:22px;background:#f8f5ff;padding:8px 3px;font-weight:800;color:#164d95;box-shadow:0 5px #78afcd;min-width:0}.answer svg{width:100%;display:block}.answer:active{transform:translateY(3px)}.controls{display:flex;justify-content:center;gap:10px;margin:15px 0}.action{border:3px solid #fff;border-radius:16px;background:#288de9;color:#fff;font-weight:800;padding:13px 18px}.win{text-align:center;padding:16px;font-size:24px;font-weight:900}.hidden{display:none!important}@media(max-width:600px){.answers{grid-template-columns:repeat(2,1fr)}.answer{max-height:175px}.answer svg{height:112px}.scene{height:220px}.station{display:none}}

.track:after{content:"";position:absolute;right:5%;bottom:70px;width:106px;height:22px;background:#ed5e53;border:4px solid #a63832;border-radius:18px 18px 8px 8px;transform:skewX(-12deg);z-index:1}
.train{bottom:18%;left:2.5%;gap:2px;z-index:5;filter:drop-shadow(0 14px 12px #4161872b)}
.engine{width:clamp(122px,23vw,220px)}
.mini{width:clamp(59px,13vw,132px)}
.prompt{border:4px solid #fff;background:linear-gradient(#fffef9,#fff7e8);box-shadow:0 9px 24px #4d6f9420;color:#315f9c}
.stars{margin:10px 0 7px;letter-spacing:3px;filter:drop-shadow(0 2px 2px #506b8d2b)}
.answers{gap:12px}
.answer{border:4px solid #fff;border-radius:25px;background:linear-gradient(#fff,#f4f9ff);box-shadow:0 7px 0 #bfd5e6,0 14px 26px #4b6b8c18;padding:10px 5px;transition:transform .12s,box-shadow .12s}
.answer:active{transform:translateY(4px);box-shadow:0 3px 0 #bfd5e6,0 8px 14px #4b6b8c15}
.answer div{font-size:17px;color:#3e6397;margin-top:2px}
.win{background:linear-gradient(#fff8c9,#fff);border:4px solid #fff;border-radius:24px;box-shadow:0 12px 28px #4b6c8f22;color:#6f57b1}
.controls{margin-top:16px}
@media(max-width:600px){
  .scene{height:285px}
  .station{display:block;transform:scale(.72);transform-origin:right bottom;right:0;bottom:27%}
  .train{left:1.5%;bottom:18%}
  .answers{grid-template-columns:repeat(2,1fr)}
  .answer{max-height:none;min-height:150px}
}

</style></head><body><main><div class="header"><a class="home" href="./">← Ігри</a><h1>🚂 Веселий потяг</h1><button class="action" id="sound">🔊</button></div><div class="modes"><button class="mode active" data-mode="color">🎨 Кольори</button><button class="mode" data-mode="shape">🔷 Фігури</button><button class="mode" data-mode="count">🔢 Рахунок</button><button class="mode" data-mode="animal">🐰 Тваринки</button></div><div class="scene"><div class="cloud">☁️</div><div class="sun">🌞</div><div class="hill a"></div><div class="hill b"></div><div class="station" aria-hidden="true"></div><div class="track"></div><div id="train" class="train"><svg class="engine" viewBox="0 0 220 160" aria-hidden="true">

</svg><div id="wagons" style="display:flex;align-items:end"></div></div></div><div class="stars" id="stars">☆ ☆ ☆ ☆</div><div class="prompt" id="prompt">Знайди червоний вагончик!</div><div class="answers" id="answers"></div><div class="win hidden" id="win">🎉 Ура! Потяг вирушив!<div style="margin-top:12px"><button class="action" id="again">🚂 Грати ще раз</button></div></div><div class="controls"><button class="action" id="repeat">🔊 Повторити завдання</button><button class="action" id="restart">↻ Спочатку</button></div></main><script>
(()=>{const $=id=>document.getElementById(id),C=['#f44842','#ffd03e','#3288ef','#38ba60'],CN=['червоний','жовтий','синій','зелений'],AN=['песика','котика','ведмедика','зайчика'],AE=['🐶','🐱','🐻','🐰'],SH=['●','■','▲','★'],SN=['коло','квадрат','трикутник','зірочку'];let mode='color',step=0,order=[0,1,2,3],locked=false,won=false,sound=true,ac=null,timers=[];function later(fn,ms){timers.push(setTimeout(fn,ms))}function beep(f,d=.17){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}function say(t){if(!sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='uk-UA';u.rate=.82;u.pitch=1.13;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('uk'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function task(){return mode==='color'?'Знайди '+CN[step]+' вагончик!':mode==='shape'?'Знайди вагончик із фігурою: '+SN[step]+'!':mode==='count'?'Знайди вагончик, де '+(step+1)+' '+(step===0?'звірятко!':'звірятка!'):'Знайди '+AN[step]+'!'}function shuffled(){order=[0,1,2,3];for(let i=3;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}function inner(i){if(mode==='shape')return '<text x="75" y="74" font-size="43" text-anchor="middle" fill="#fff" stroke="#2364a0" stroke-width="1">'+SH[i]+'</text>';if(mode==='count')return '<text x="75" y="72" font-size="'+(i>1?20:30)+'" text-anchor="middle">'+AE.slice(0,i+1).join('')+'</text>';return '<text x="75" y="75" font-size="43" text-anchor="middle">'+AE[i]+'</text>'}function wagon(i,mini=false){return '<svg '+(mini?'class="mini" ':'')+'viewBox="0 0 160 120" aria-hidden="true"><defs><linearGradient id="wg'+i+(mini?'m':'b')+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity=".08"/></linearGradient></defs><path d="M4 70H15M145 70H157" stroke="#476aa8" stroke-width="6" stroke-linecap="round"/><circle cx="5" cy="70" r="4" fill="#ffd64a" stroke="#476aa8" stroke-width="2"/><circle cx="156" cy="70" r="4" fill="#ffd64a" stroke="#476aa8" stroke-width="2"/><path d="M17 36Q22 13 49 12H111Q138 13 143 36Z" fill="'+C[i]+'" stroke="#2d62a4" stroke-width="4"/><rect x="14" y="35" width="132" height="58" rx="17" fill="'+C[i]+'" stroke="#2d62a4" stroke-width="4"/><rect x="27" y="43" width="106" height="34" rx="11" fill="#d4f3ff" stroke="#fff" stroke-width="4"/><rect x="27" y="43" width="106" height="34" rx="11" fill="url(#wg'+i+(mini?'m':'b')+')"/>'+inner(i)+'<path d="M21 84H139" stroke="#ffffff88" stroke-width="3" stroke-linecap="round"/><circle cx="43" cy="98" r="15" fill="#4769aa" stroke="#ffd64a" stroke-width="6"/><circle cx="117" cy="98" r="15" fill="#4769aa" stroke="#ffd64a" stroke-width="6"/><circle cx="43" cy="98" r="5" fill="#c7e0ff"/><circle cx="117" cy="98" r="5" fill="#c7e0ff"/></svg>'}function render(){const a=$('answers');a.innerHTML='';order.forEach(i=>{let b=document.createElement('button');b.className='answer';b.innerHTML=wagon(i)+'<div>'+(mode==='color'?CN[i]:mode==='shape'?SN[i]:mode==='count'?i+1+' звірят':' '+AN[i])+'</div>';b.onclick=()=>choose(i,b);a.appendChild(b)});$('prompt').textContent=task();$('stars').textContent=Array.from({length:4},(_,i)=>i<step?'⭐':'☆').join(' ')}function choose(i,b){if(locked||won)return;if(i!==step){b.style.borderColor='#f35d64';beep(220);say('Спробуй ще. '+task());return}locked=true;beep(650);later(()=>beep(840),140);$('wagons').insertAdjacentHTML('beforeend',wagon(i,true));step++;$('stars').textContent=Array.from({length:4},(_,j)=>j<step?'⭐':'☆').join(' ');if(step===4){won=true;$('answers').classList.add('hidden');$('repeat').classList.add('hidden');$('prompt').textContent='Ура! Потяг вирушає!';say('Молодець! Всі вагончики зібрано! Поїхали!');later(()=>{beep(350,.45);later(()=>beep(280,.6),250);$('train').classList.add('depart')},950);later(()=>$('win').classList.remove('hidden'),4600)}else later(()=>{shuffled();render();locked=false;say('Молодець! '+task())},700)}function reset(arrive){timers.forEach(clearTimeout);timers=[];try{speechSynthesis.cancel()}catch(e){}step=0;won=false;locked=arrive;$('train').classList.remove('depart','arrive');void $('train').offsetWidth;$('wagons').innerHTML='';$('answers').classList.remove('hidden');$('repeat').classList.remove('hidden');$('win').classList.add('hidden');shuffled();render();if(arrive){$('train').classList.add('arrive');later(()=>{locked=false;say(task())},2100)}else locked=false}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));reset(true)});$('again').onclick=()=>reset(true);$('restart').onclick=()=>reset(true);$('repeat').onclick=()=>say(task());$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';if(!sound)try{speechSynthesis.cancel()}catch(e){}else say(task())};shuffled();render()})();
</script></body></html>
