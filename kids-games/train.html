<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#79cffa"><title>Веселий потяг — Kids Playground</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#a8e8ff;color:#12396d}button{font:inherit;cursor:pointer;touch-action:manipulation}main{max-width:1000px;margin:auto;padding:12px}.header{display:flex;align-items:center;justify-content:space-between;gap:10px}.home{color:#124f9c;text-decoration:none;font-weight:800;background:#fff;padding:12px;border-radius:18px}h1{font-size:clamp(25px,5vw,48px);text-align:center;color:#ffdb45;-webkit-text-stroke:1.5px #174b9e;text-shadow:2px 4px #174b9e;margin:10px 0}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.mode{border:3px solid #fff;border-radius:18px;background:#e8f7ff;padding:10px 2px;font-weight:850;color:#1856a0;font-size:clamp(11px,2.5vw,17px)}.mode.active{background:#ffdc60;border-color:#f39b3a}.scene{height:clamp(210px,37vw,345px);border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(#69cafa,#baf0ff 60%,#9de35c 61%,#56b34d);border:4px solid white}.cloud{position:absolute;font-size:35px;top:10%;left:17%}.sun{position:absolute;font-size:55px;right:5%;top:4%}.hill{position:absolute;bottom:17%;width:55%;height:26%;border-radius:60% 70% 0 0;background:#8ed466}.hill.a{left:-12%}.hill.b{right:-15%;background:#74c85b}.track{position:absolute;bottom:12%;height:13px;background:repeating-linear-gradient(90deg,#a16e3d 0 16px,#604c3e 16px 23px);width:100%;border-top:5px solid #59626b}.train{position:absolute;bottom:16%;left:1%;display:flex;align-items:end;gap:0;white-space:nowrap}.train.depart{animation:depart 4s ease-in forwards}.train.arrive{animation:arrive 2s ease-out both}@keyframes depart{0%{transform:translateX(0)}20%{transform:translateX(12px)}100%{transform:translateX(-130vw)}}@keyframes arrive{from{transform:translateX(130vw)}to{transform:translateX(0)}}.engine{width:clamp(105px,22vw,215px);flex:none}.mini{width:clamp(55px,14vw,140px);flex:none}.station{position:absolute;right:4%;bottom:25%;font-size:clamp(30px,7vw,65px)}.prompt{background:#fff;border:4px solid #64bff2;border-radius:25px;text-align:center;padding:12px;margin:12px 0;font-size:clamp(19px,4vw,29px);font-weight:900}.stars{text-align:center;font-size:25px}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.answer{border:4px solid #fff;border-radius:22px;background:#f8f5ff;padding:8px 3px;font-weight:800;color:#164d95;box-shadow:0 5px #78afcd;min-width:0}.answer svg{width:100%;display:block}.answer:active{transform:translateY(3px)}.controls{display:flex;justify-content:center;gap:10px;margin:15px 0}.action{border:3px solid #fff;border-radius:16px;background:#288de9;color:#fff;font-weight:800;padding:13px 18px}.win{text-align:center;padding:16px;font-size:24px;font-weight:900}.hidden{display:none!important}@media(max-width:600px){.answers{grid-template-columns:repeat(2,1fr)}.answer{max-height:175px}.answer svg{height:112px}.scene{height:220px}.station{display:none}}
</style></head><body><main><div class="header"><a class="home" href="./">← Ігри</a><h1>🚂 Веселий потяг</h1><button class="action" id="sound">🔊</button></div><div class="modes"><button class="mode active" data-mode="color">🎨 Кольори</button><button class="mode" data-mode="shape">🔷 Фігури</button><button class="mode" data-mode="count">🔢 Рахунок</button><button class="mode" data-mode="animal">🐰 Тваринки</button></div><div class="scene"><div class="cloud">☁️</div><div class="sun">🌞</div><div class="hill a"></div><div class="hill b"></div><div class="station">🏡🌳</div><div class="track"></div><div id="train" class="train"><svg class="engine" viewBox="0 0 210 160"><ellipse cx="107" cy="145" rx="98" ry="9" fill="#387d47" opacity=".3"/><rect x="106" y="35" width="85" height="95" rx="16" fill="#2684df" stroke="#14529d" stroke-width="5"/><path d="M99 40Q125 12 195 35L197 45H99Z" fill="#f44b3d" stroke="#b52a24" stroke-width="4"/><rect x="132" y="48" width="43" height="40" rx="8" fill="#b4efff" stroke="#135ba0" stroke-width="4"/><rect x="29" y="70" width="115" height="61" rx="25" fill="#f24e3e" stroke="#ad2924" stroke-width="5"/><rect x="57" y="25" width="26" height="49" rx="5" fill="#1675d4" stroke="#164c98" stroke-width="4"/><ellipse cx="70" cy="24" rx="25" ry="12" fill="#ffcf35" stroke="#b87312" stroke-width="4"/><circle cx="63" cy="99" r="43" fill="#81d0ff" stroke="#1758a7" stroke-width="6"/><ellipse cx="48" cy="91" rx="10" ry="15" fill="white"/><ellipse cx="78" cy="91" rx="10" ry="15" fill="white"/><circle cx="51" cy="94" r="6" fill="#1a3268"/><circle cx="81" cy="94" r="6" fill="#1a3268"/><path d="M49 114Q65 139 84 113" fill="#f05c71" stroke="#82304c" stroke-width="4"/><circle cx="127" cy="137" r="21" fill="#e64236" stroke="#ffd64a" stroke-width="7"/><circle cx="177" cy="137" r="21" fill="#e64236" stroke="#ffd64a" stroke-width="7"/><text x="151" y="111" font-size="28">⭐</text></svg><div id="wagons" style="display:flex;align-items:end"></div></div></div><div class="stars" id="stars">☆ ☆ ☆ ☆</div><div class="prompt" id="prompt">Знайди червоний вагончик!</div><div class="answers" id="answers"></div><div class="win hidden" id="win">🎉 Ура! Потяг вирушив!<div style="margin-top:12px"><button class="action" id="again">🚂 Грати ще раз</button></div></div><div class="controls"><button class="action" id="repeat">🔊 Повторити завдання</button><button class="action" id="restart">↻ Спочатку</button></div></main><script>
(()=>{const $=id=>document.getElementById(id),C=['#f44842','#ffd03e','#3288ef','#38ba60'],CN=['червоний','жовтий','синій','зелений'],AN=['песика','котика','ведмедика','зайчика'],AE=['🐶','🐱','🐻','🐰'],SH=['●','■','▲','★'],SN=['коло','квадрат','трикутник','зірочку'];let mode='color',step=0,order=[0,1,2,3],locked=false,won=false,sound=true,ac=null,timers=[];function later(fn,ms){timers.push(setTimeout(fn,ms))}function beep(f,d=.17){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}function say(t){if(!sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='uk-UA';u.rate=.82;u.pitch=1.13;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('uk'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function task(){return mode==='color'?'Знайди '+CN[step]+' вагончик!':mode==='shape'?'Знайди вагончик із фігурою: '+SN[step]+'!':mode==='count'?'Знайди вагончик, де '+(step+1)+' '+(step===0?'звірятко!':'звірятка!'):'Знайди '+AN[step]+'!'}function shuffled(){order=[0,1,2,3];for(let i=3;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}function inner(i){if(mode==='shape')return '<text x="75" y="74" font-size="43" text-anchor="middle" fill="#fff" stroke="#2364a0" stroke-width="1">'+SH[i]+'</text>';if(mode==='count')return '<text x="75" y="72" font-size="'+(i>1?20:30)+'" text-anchor="middle">'+AE.slice(0,i+1).join('')+'</text>';return '<text x="75" y="75" font-size="43" text-anchor="middle">'+AE[i]+'</text>'}function wagon(i,mini=false){return '<svg '+(mini?'class="mini" ':'')+'viewBox="0 0 150 120" aria-hidden="true"><rect x="9" y="35" width="132" height="67" rx="15" fill="'+C[i]+'" stroke="#1a58a1" stroke-width="4"/><path d="M6 41Q11 15 40 15H110Q140 15 144 41Z" fill="'+C[i]+'" stroke="#1758a3" stroke-width="4"/><rect x="23" y="42" width="104" height="46" rx="10" fill="#b6edff" stroke="#fff" stroke-width="4"/>'+inner(i)+'<circle cx="41" cy="101" r="15" fill="#2860b5" stroke="#ffda5d" stroke-width="6"/><circle cx="111" cy="101" r="15" fill="#2860b5" stroke="#ffda5d" stroke-width="6"/></svg>'}function render(){const a=$('answers');a.innerHTML='';order.forEach(i=>{let b=document.createElement('button');b.className='answer';b.innerHTML=wagon(i)+'<div>'+(mode==='color'?CN[i]:mode==='shape'?SN[i]:mode==='count'?i+1+' звірят':' '+AN[i])+'</div>';b.onclick=()=>choose(i,b);a.appendChild(b)});$('prompt').textContent=task();$('stars').textContent=Array.from({length:4},(_,i)=>i<step?'⭐':'☆').join(' ')}function choose(i,b){if(locked||won)return;if(i!==step){b.style.borderColor='#f35d64';beep(220);say('Спробуй ще. '+task());return}locked=true;beep(650);later(()=>beep(840),140);$('wagons').insertAdjacentHTML('beforeend',wagon(i,true));step++;$('stars').textContent=Array.from({length:4},(_,j)=>j<step?'⭐':'☆').join(' ');if(step===4){won=true;$('answers').classList.add('hidden');$('repeat').classList.add('hidden');$('prompt').textContent='Ура! Потяг вирушає!';say('Молодець! Всі вагончики зібрано! Поїхали!');later(()=>{beep(350,.45);later(()=>beep(280,.6),250);$('train').classList.add('depart')},950);later(()=>$('win').classList.remove('hidden'),4600)}else later(()=>{shuffled();render();locked=false;say('Молодець! '+task())},700)}function reset(arrive){timers.forEach(clearTimeout);timers=[];try{speechSynthesis.cancel()}catch(e){}step=0;won=false;locked=arrive;$('train').classList.remove('depart','arrive');void $('train').offsetWidth;$('wagons').innerHTML='';$('answers').classList.remove('hidden');$('repeat').classList.remove('hidden');$('win').classList.add('hidden');shuffled();render();if(arrive){$('train').classList.add('arrive');later(()=>{locked=false;say(task())},2100)}else locked=false}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));reset(true)});$('again').onclick=()=>reset(true);$('restart').onclick=()=>reset(true);$('repeat').onclick=()=>say(task());$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';if(!sound)try{speechSynthesis.cancel()}catch(e){}else say(task())};shuffled();render()})();
</script></body></html>
