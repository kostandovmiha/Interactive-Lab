<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#79cffa"><title>Веселий потяг — Kids Playground</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#a8e8ff;color:#12396d}button{font:inherit;cursor:pointer;touch-action:manipulation}main{max-width:1000px;margin:auto;padding:12px}.header{display:flex;align-items:center;justify-content:space-between;gap:10px}.home{color:#124f9c;text-decoration:none;font-weight:800;background:#fff;padding:12px;border-radius:18px}h1{font-size:clamp(25px,5vw,48px);text-align:center;color:#ffdb45;-webkit-text-stroke:1.5px #174b9e;text-shadow:2px 4px #174b9e;margin:10px 0}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.mode{border:3px solid #fff;border-radius:18px;background:#e8f7ff;padding:10px 2px;font-weight:850;color:#1856a0;font-size:clamp(11px,2.5vw,17px)}.mode.active{background:#ffdc60;border-color:#f39b3a}.scene{height:clamp(210px,37vw,345px);border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(#69cafa,#baf0ff 60%,#9de35c 61%,#56b34d);border:4px solid white}.cloud{position:absolute;font-size:35px;top:10%;left:17%}.sun{position:absolute;font-size:55px;right:5%;top:4%}.hill{position:absolute;bottom:17%;width:55%;height:26%;border-radius:60% 70% 0 0;background:#8ed466}.hill.a{left:-12%}.hill.b{right:-15%;background:#74c85b}.track{position:absolute;bottom:12%;height:13px;background:repeating-linear-gradient(90deg,#a16e3d 0 16px,#604c3e 16px 23px);width:100%;border-top:5px solid #59626b}.train{position:absolute;bottom:16%;left:1%;display:flex;align-items:end;gap:0;white-space:nowrap}.train.depart{animation:depart 4s ease-in forwards}.train.arrive{animation:arrive 2s ease-out both}@keyframes depart{0%{transform:translateX(0)}20%{transform:translateX(12px)}100%{transform:translateX(-130vw)}}@keyframes arrive{from{transform:translateX(130vw)}to{transform:translateX(0)}}.engine{width:clamp(105px,22vw,215px);height:auto;display:block;object-fit:contain;flex:none;user-select:none;-webkit-user-drag:none}.mini{width:clamp(55px,14vw,140px);flex:none}.station{position:absolute;right:4%;bottom:25%;font-size:clamp(30px,7vw,65px)}.prompt{background:#fff;border:4px solid #64bff2;border-radius:25px;text-align:center;padding:12px;margin:12px 0;font-size:clamp(19px,4vw,29px);font-weight:900}.stars{text-align:center;font-size:25px}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.answer{border:4px solid #fff;border-radius:22px;background:#f8f5ff;padding:8px 3px;font-weight:800;color:#164d95;box-shadow:0 5px #78afcd;min-width:0}.answer svg{width:100%;display:block}.answer:active{transform:translateY(3px)}.controls{display:flex;justify-content:center;gap:10px;margin:15px 0}.action{border:3px solid #fff;border-radius:16px;background:#288de9;color:#fff;font-weight:800;padding:13px 18px}.win{text-align:center;padding:16px;font-size:24px;font-weight:900}.hidden{display:none!important}@media(max-width:600px){.answers{grid-template-columns:repeat(2,1fr)}.answer{max-height:175px}.answer svg{height:112px}.scene{height:220px}.station{display:none}}

/* Painted wagon assets with independently animated SVG wheels */
.wagon-art{position:relative;display:block;width:100%;max-width:150px;aspect-ratio:150/122;flex-shrink:0;isolation:isolate}
.wagon-art.mini{width:clamp(55px,14vw,140px);max-width:none}
.wagon-body{position:absolute;z-index:2;top:0;left:0;width:100%;height:auto;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.wagon-window-content{position:absolute;z-index:1;left:23%;top:27%;width:54%;height:29%;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3.6vw,37px);line-height:1;pointer-events:none;white-space:nowrap}
.wagon-art.mini .wagon-window-content{font-size:clamp(11px,2.5vw,24px)}
.wagon-window-content.count{font-size:clamp(12px,2.3vw,22px)}
.wagon-art.mini .wagon-window-content.count{font-size:clamp(7px,1.4vw,14px)}
.wagon-window-content.shape{color:#ffe45b;text-shadow:0 2px 1px #3b5594,0 0 2px #314d86;font-weight:900}
.wagon-wheel-svg{position:absolute;z-index:3;left:0;top:65%;width:100%;height:35%;overflow:visible;pointer-events:none;filter:drop-shadow(0 2px 2px #324c7055)}
.wagon-wheel-svg .rolling-wheel{transform-box:fill-box;transform-origin:center center}
.train.depart .rolling-wheel,.train.arrive .rolling-wheel{animation:wheelRolling .55s linear infinite}
@keyframes wheelRolling{to{transform:rotate(-360deg)}}
.answer .wagon-art{margin:0 auto}
.answer .wagon-wheel-svg{display:block}
@media(max-width:600px){.wagon-window-content{font-size:clamp(20px,5vw,30px)}.wagon-art.mini .wagon-window-content{font-size:clamp(11px,2.5vw,17px)}}
</style></head><body><main><div class="header"><a class="home" href="./">← Ігри</a><h1>🚂 Веселий потяг</h1><button class="action" id="sound">🔊</button></div><div class="modes"><button class="mode active" data-mode="color">🎨 Кольори</button><button class="mode" data-mode="shape">🔷 Фігури</button><button class="mode" data-mode="count">🔢 Рахунок</button><button class="mode" data-mode="animal">🐰 Тваринки</button></div><div class="scene"><div class="cloud">☁️</div><div class="sun">🌞</div><div class="hill a"></div><div class="hill b"></div><div class="station">🏡🌳</div><div class="track"></div><div id="train" class="train"><img class="engine" src="./assets/engine.webp" width="215" height="158" alt="Веселий паровозик" draggable="false"><div id="wagons" style="display:flex;align-items:end"></div></div></div><div class="stars" id="stars">☆ ☆ ☆ ☆</div><div class="prompt" id="prompt">Знайди червоний вагончик!</div><div class="answers" id="answers"></div><div class="win hidden" id="win">🎉 Ура! Потяг вирушив!<div style="margin-top:12px"><button class="action" id="again">🚂 Грати ще раз</button></div></div><div class="controls"><button class="action" id="repeat">🔊 Повторити завдання</button><button class="action" id="restart">↻ Спочатку</button></div></main><script>
(()=>{const $=id=>document.getElementById(id),C=['#f44842','#ffd03e','#3288ef','#38ba60'],CN=['червоний','жовтий','синій','зелений'],AN=['песика','котика','ведмедика','зайчика'],AE=['🐶','🐱','🐻','🐰'],SH=['●','■','▲','★'],SN=['коло','квадрат','трикутник','зірочку'];let mode='color',step=0,order=[0,1,2,3],locked=false,won=false,sound=true,ac=null,timers=[];function later(fn,ms){timers.push(setTimeout(fn,ms))}function beep(f,d=.17){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}function say(t){if(!sound||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='uk-UA';u.rate=.82;u.pitch=1.13;const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('uk'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function task(){return mode==='color'?'Знайди '+CN[step]+' вагончик!':mode==='shape'?'Знайди вагончик із фігурою: '+SN[step]+'!':mode==='count'?'Знайди вагончик, де '+(step+1)+' '+(step===0?'звірятко!':'звірятка!'):'Знайди '+AN[step]+'!'}function shuffled(){order=[0,1,2,3];for(let i=3;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}function inner(i){if(mode==='shape')return '<span class="wagon-window-content shape">'+SH[i]+'</span>';if(mode==='count')return '<span class="wagon-window-content count">'+AE.slice(0,i+1).join('')+'</span>';return '<span class="wagon-window-content">'+AE[i]+'</span>'}
function wheelSvg(){return '<svg class="wagon-wheel-svg" viewBox="0 0 150 45" aria-hidden="true"><g class="rolling-wheel"><circle cx="42" cy="22" r="17" fill="#ffdc58" stroke="#234d8f" stroke-width="3"/><circle cx="42" cy="22" r="12" fill="#e74f43"/><path d="M42 11V33M31 22H53M34 14L50 30M50 14L34 30" stroke="#ffd95a" stroke-width="3"/><circle cx="42" cy="22" r="5" fill="#ffdf64" stroke="#315a99" stroke-width="2"/></g><g class="rolling-wheel"><circle cx="110" cy="22" r="17" fill="#ffdc58" stroke="#234d8f" stroke-width="3"/><circle cx="110" cy="22" r="12" fill="#e74f43"/><path d="M110 11V33M99 22H121M102 14L118 30M118 14L102 30" stroke="#ffd95a" stroke-width="3"/><circle cx="110" cy="22" r="5" fill="#ffdf64" stroke="#315a99" stroke-width="2"/></g></svg>'}
function wagon(i,mini=false){return '<div class="wagon-art'+(mini?' mini':'')+'">'+inner(i)+'<img class="wagon-body" src="./assets/wagon-'+['red','yellow','blue','green'][i]+'.webp" alt="" draggable="false">'+wheelSvg()+'</div>'}
function render(){const a=$('answers');a.innerHTML='';order.forEach(i=>{let b=document.createElement('button');b.className='answer';b.innerHTML=wagon(i)+'<div>'+(mode==='color'?CN[i]:mode==='shape'?SN[i]:mode==='count'?i+1+' звірят':' '+AN[i])+'</div>';b.onclick=()=>choose(i,b);a.appendChild(b)});$('prompt').textContent=task();$('stars').textContent=Array.from({length:4},(_,i)=>i<step?'⭐':'☆').join(' ')}function choose(i,b){if(locked||won)return;if(i!==step){b.style.borderColor='#f35d64';beep(220);say('Спробуй ще. '+task());return}locked=true;beep(650);later(()=>beep(840),140);$('wagons').insertAdjacentHTML('beforeend',wagon(i,true));step++;$('stars').textContent=Array.from({length:4},(_,j)=>j<step?'⭐':'☆').join(' ');if(step===4){won=true;$('answers').classList.add('hidden');$('repeat').classList.add('hidden');$('prompt').textContent='Ура! Потяг вирушає!';say('Молодець! Всі вагончики зібрано! Поїхали!');later(()=>{beep(350,.45);later(()=>beep(280,.6),250);$('train').classList.add('depart')},950);later(()=>$('win').classList.remove('hidden'),4600)}else later(()=>{shuffled();render();locked=false;say('Молодець! '+task())},700)}function reset(arrive){timers.forEach(clearTimeout);timers=[];try{speechSynthesis.cancel()}catch(e){}step=0;won=false;locked=arrive;$('train').classList.remove('depart','arrive');void $('train').offsetWidth;$('wagons').innerHTML='';$('answers').classList.remove('hidden');$('repeat').classList.remove('hidden');$('win').classList.add('hidden');shuffled();render();if(arrive){$('train').classList.add('arrive');later(()=>{locked=false;say(task())},2100)}else locked=false}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));reset(true)});$('again').onclick=()=>reset(true);$('restart').onclick=()=>reset(true);$('repeat').onclick=()=>say(task());$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';if(!sound)try{speechSynthesis.cancel()}catch(e){}else say(task())};shuffled();render()})();
</script></body></html>
