.scene{position:relative;aspect-ratio:1/1;border:2px solid #e8e9ff;border-radius:22px;overflow:hidden;background:linear-gradient(165deg,#f4fcff,#fffdf7);user-select:none;-webkit-user-select:none}

.scene.complete .hint{background:#d8ffed;color:#237b59}

const colors={легко:'#7860e9',середньо:'#658dc8',складно:'#eb8b54'};
const svg=$('drawing'),levels=$('levels'),dots=$('dots'),trails=$('trails');
let selected=0,filter='легко',position=0,dragging=false,soundOn=true,audioCtx=null,fillOn=true,zoomOn=true;
let complete=new Set();
try{complete=new Set(JSON.parse(localStorage.getItem('dots-kids-v4-complete')||'[]'));fillOn=localStorage.getItem('dots-kids-color')!=='false';zoomOn=localStorage.getItem('dots-kids-zoom')!=='false';}catch(e){}
$('colorMode').checked=fillOn;$('zoomMode').checked=zoomOn;
const totalOf=pic=>pic.parts.reduce((sum,part)=>sum+part.n,0);
function computeSamples(part){
 const path=document.createElementNS(NS,'path');path.setAttribute('d',part.d);path.setAttribute('fill','none');svg.appendChild(path);
 try{
  const bounds=path.getBBox();part.bounds={x:bounds.x,y:bounds.y,width:bounds.width,height:bounds.height};
  const length=path.getTotalLength();
  if(!Number.isFinite(length)||length<1)throw Error('Invalid drawing path');
  const divisor=(part.closed===false?part.n-1:part.n);
  part.points=Array.from({length:part.n},(_,i)=>{const p=path.getPointAtLength(length*i/divisor);return [Number(p.x.toFixed(2)),Number(p.y.toFixed(2))];});
 }finally{path.remove();}
}
for(const pic of pictures)for(const part of pic.parts)computeSamples(part);
function locationFor(pic){let offset=0;for(let i=0;i<pic.parts.length;i++){const end=offset+pic.parts[i].n;if(position<end)return {i,part:pic.parts[i],local:position-offset,offset};offset=end;}return {i:pic.parts.length,part:null,local:0,offset};}
function note(hz){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx??=new C();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type='sine';o.frequency.setValueAtTime(hz,t);o.frequency.linearRampToValueAtTime(hz*1.12,t+.1);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+.16);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.17);}catch(e){}}
function toast(t){const el=$('toast');el.textContent=t;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');}
function confetti(){const signs=['✨','⭐','💛','🌈','🎉'];for(let i=0;i<18;i++){const el=document.createElement('span');el.className='spark';el.textContent=signs[i%signs.length];el.style.setProperty('--x',((Math.random()-.5)*330)+'px');el.style.setProperty('--y',((Math.random()-.5)*330)+'px');el.style.setProperty('--r',((Math.random()-.5)*270)+'deg');el.style.animationDelay=i*.03+'s';$('scene').appendChild(el);el.addEventListener('animationend',()=>el.remove());}}
function renderLevels(){const left=levels.scrollLeft;levels.innerHTML=pictures.map((pic,i)=>({pic,i})).filter(x=>x.pic.difficulty===filter).map(({pic,i})=>`<button type="button" class="level" data-index="${i}" aria-pressed="${selected===i}"><span class="em">${pic.emoji}</span><span class="nm">${pic.name}</span><span class="count">${totalOf(pic)} точок</span>${complete.has(i)?'<span class="check">✓</span>':''}</button>`).join('');levels.scrollLeft=left;levels.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>start(Number(b.dataset.index))));}
function render(){
 const pic=pictures[selected],total=totalOf(pic),done=position===total,loc=locationFor(pic);
 $('pictureName').textContent=pic.emoji+' '+pic.name;
 let zoomSize=400;
 if(!done && zoomOn && loc.part){
  const b=loc.part.bounds, extent=Math.max(b.width,b.height);
  zoomSize=Math.min(400,Math.max(150,extent*1.8));
  const cx=b.x+b.width/2,cy=b.y+b.height/2;
  svg.setAttribute('viewBox',`${cx-zoomSize/2} ${cy-zoomSize/2} ${zoomSize} ${zoomSize}`);
 }else svg.setAttribute('viewBox','0 0 400 400');
 const scale=zoomSize/400;

 $('counter').textContent=position+' / '+total;
 $('bar').style.width=position/total*100+'%';
 $('scene').classList.toggle('complete',done);
 $('phase').textContent=done?`Усі ${pic.parts.length} етапів завершено!`:`Етап ${loc.i+1} із ${pic.parts.length}: ${loc.part.name}`;
 $('hint').textContent=done?'🎉 Вийшло! Молодець!':`Знайди точку ${loc.local+1} 👆`;
 const finished=$('finished');
 const visible=pic.parts.slice(0,loc.i);
 // A traced step becomes a real vector shape immediately. Optional color is controlled separately.
 finished.innerHTML=`<g class="${done?'finish-art':''}">${visible.map(p=>`<path d="${p.d}" fill="${fillOn?(p.fill||'none'):'none'}" stroke="${fillOn?(p.stroke||'#5d638d'):'#5d638d'}" stroke-width="${p.strokeWidth||4}" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}${done&&fillOn?(pic.details||''):''}</g>`;
 trails.innerHTML=done||!loc.local?'':`<polyline points="${loc.part.points.slice(0,loc.local).map(p=>p.join(',')).join(' ')}" fill="none" stroke="${loc.part.stroke||colors[pic.difficulty]}" stroke-width="${(loc.part.strokeWidth||5)*scale}" stroke-linecap="round" stroke-linejoin="round"/>`;
 dots.innerHTML=done?'':loc.part.points.map((p,i)=>{
   if(i<loc.local)return `<circle cx="${p[0]}" cy="${p[1]}" r="${4.5*scale}" fill="${colors[pic.difficulty]}" stroke="#fff" stroke-width="${2*scale}"/>`;
   const active=i===loc.local;
   return `<g class="dot" data-index="${i}"${active?' data-next="true"':''}>
     <circle cx="${p[0]}" cy="${p[1]}" r="${(active?23:19)*scale}" fill="#fff" opacity=".001"/>
     ${active?`<circle class="nextRing" cx="${p[0]}" cy="${p[1]}" r="${19*scale}" fill="#e5d9ff" stroke="#9278ed" stroke-width="${2*scale}"/>`:''}
     <circle cx="${p[0]}" cy="${p[1]}" r="${13.7*scale}" fill="${active?colors[pic.difficulty]:'#fff'}" stroke="${active?colors[pic.difficulty]:'#b8c6df'}" stroke-width="${2*scale}"/>
     <text x="${p[0]}" y="${p[1]+4.4*scale}" font-size="${(i>=9?11.3:12.8)*scale}" font-weight="900" text-anchor="middle" fill="${active?'white':'#41597d'}" pointer-events="none">${i+1}</text>
   </g>`;
 }).join('');
 $('preview').style.display='none';
 $('note').textContent=done?'Тепер можна обрати наступний малюнок 🌈':'З’єднуй точки на поточній деталі. Після завершення вона залишиться на малюнку, і почнеться новий етап.';
}
function advance(){const pic=pictures[selected],prevLoc=locationFor(pic);position++;note(430+position*11);const afterLoc=locationFor(pic);render();if(position===totalOf(pic)){complete.add(selected);try{localStorage.setItem('dots-kids-v4-complete',JSON.stringify([...complete]));}catch(e){}renderLevels();toast('Ти впорався! '+pic.emoji);confetti();for(const [i,f]of [640,800,990].entries())setTimeout(()=>note(f),120+i*120);}else if(afterLoc.i!==prevLoc.i){toast('✅ '+prevLoc.part.name+' — готово!');}}
function start(index){if(index<0||index>=pictures.length)return;selected=index;position=0;dragging=false;const next=pictures[index].difficulty;if(next!==filter){filter=next;for(const b of document.querySelectorAll('.filter'))b.setAttribute('aria-pressed',b.dataset.difficulty===filter?'true':'false');levels.scrollLeft=0;}renderLevels();render();}
function pos(evt){const p=svg.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;const m=svg.getScreenCTM();if(!m)return [-10000,-10000];const transformed=p.matrixTransform(m.inverse());return [transformed.x,transformed.y];}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function segmentDistance(p,a,b){if(!a)return dist(p,b);const vx=b[0]-a[0],vy=b[1]-a[1],d=vx*vx+vy*vy;if(!d)return dist(p,b);const t=Math.max(0,Math.min(1,((p[0]-a[0])*vx+(p[1]-a[1])*vy)/d));return Math.hypot(p[0]-(a[0]+t*vx),p[1]-(a[1]+t*vy));}
let previousPointer=null;
function tryPoint(evt){const pic=pictures[selected],loc=locationFor(pic);if(!loc.part)return;const xy=pos(evt),next=loc.part.points[loc.local];if(segmentDistance(next,previousPointer,xy)<21){advance();previousPointer=xy;}else{if(!dragging&&loc.part.points.some((p,i)=>i>loc.local&&dist(p,xy)<18))toast('Спочатку цифра '+(loc.local+1)+' 👀');previousPointer=xy;}}
svg.addEventListener('pointerdown',e=>{e.preventDefault();dragging=true;previousPointer=null;try{svg.setPointerCapture(e.pointerId);}catch(_){}tryPoint(e);});
svg.addEventListener('pointermove',e=>{if(!dragging)return;const pic=pictures[selected],loc=locationFor(pic);if(!loc.part)return;const xy=pos(e);if(loc.local>0){const preview=$('preview'),last=loc.part.points[loc.local-1];preview.style.display='';preview.setAttribute('x1',last[0]);preview.setAttribute('y1',last[1]);preview.setAttribute('x2',xy[0]);preview.setAttribute('y2',xy[1]);}tryPoint(e);});
function release(){dragging=false;previousPointer=null;$('preview').style.display='none';}
for(const event of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(event,release);
$('hintBtn').addEventListener('click',()=>{const loc=locationFor(pictures[selected]);if(!loc.part){toast('Усе готово! 🌈');return;}toast('Шукай цифру '+(loc.local+1)+' 💡');const g=dots.querySelector('[data-next]');if(g&&g.animate)g.animate([{opacity:1},{opacity:.3},{opacity:1},{opacity:.3},{opacity:1}],{duration:950});note(590);});
$('resetBtn').addEventListener('click',()=>{start(selected);toast('Починай з 1! ✨');});
$('nextBtn').addEventListener('click',()=>start((selected+1)%pictures.length));
$('colorMode').addEventListener('change',e=>{fillOn=e.target.checked;try{localStorage.setItem('dots-kids-color',String(fillOn));}catch(_){ }render();});
$('zoomMode').addEventListener('change',e=>{zoomOn=e.target.checked;try{localStorage.setItem('dots-kids-zoom',String(zoomOn));}catch(_){ }render();});
$('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊':'🔇';$('sound').setAttribute('aria-label',soundOn?'Вимкнути звук':'Увімкнути звук');if(soundOn)note(680);});
for(const button of document.querySelectorAll('.filter'))button.addEventListener('click',()=>{filter=button.dataset.difficulty;for(const b of document.querySelectorAll('.filter'))b.setAttribute('aria-pressed',b===button?'true':'false');levels.scrollLeft=0;renderLevels();});
$('totalLabel').textContent=pictures.length+' малюнків';
start(0);
})();
</script>
